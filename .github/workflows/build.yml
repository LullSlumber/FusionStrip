name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
      - 'ci/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 仓库不带签名（keystore.properties 被 .gitignore 排除），CI 里现生成一套
      # 自签名密钥：装到手机上没问题，但和原作者的签名不同，覆盖安装前要先卸载
      - name: Generate CI signing keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/ci-release.jks \
            -storepass nexusfloat-ci -keypass nexusfloat-ci \
            -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NexusFloat CI"
          cat > keystore.properties <<'EOF'
          storeFile=../keystore/ci-release.jks
          storePassword=nexusfloat-ci
          keyAlias=ci
          keyPassword=nexusfloat-ci
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "NexusFloat-${VERSION}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusFloat-APK
          path: NexusFloat-*.apk

      # 同步挂到 ci-build 这个滚动 release 上，方便直接用直链下载最新包
      - name: Attach to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build
          name: CI Build
          files: NexusFloat-*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
