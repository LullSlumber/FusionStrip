name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
      - 'ci/**'

jobs:
  build:
    runs-on: ubuntu-latest
    # fork 仓库的 GITHUB_TOKEN 默认只读；挂 release 需要 contents 写权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 镜像自带 Android SDK，不用 setup-android（Ubuntu 26 上该 action 会挂）
      # 只需把缺的 platform/build-tools 交给 AGP 自动下载前接受一遍 license
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 仓库不带签名（keystore.properties 被 .gitignore 排除），CI 里现生成一套
      # 自签名密钥：装到手机上没问题，但和原作者的签名不同，覆盖安装前要先卸载
      - name: Generate CI signing keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/ci-release.jks \
            -storepass nexusfloat-ci -keypass nexusfloat-ci \
            -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FusionStrip CI"
          cat > keystore.properties <<'EOF'
          storeFile=../keystore/ci-release.jks
          storePassword=nexusfloat-ci
          keyAlias=ci
          keyPassword=nexusfloat-ci
          EOF

      - name: Build release APK
        # 仓库里 gradlew 没有可执行位（作者在 Windows 提交），用 bash 显式调用绕开
        run: bash gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "FusionStrip-${VERSION}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FusionStrip-APK
          path: FusionStrip-*.apk

      # 同步挂到 ci-build 这个滚动 release 上，方便直接用直链下载最新包
      - name: Attach to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build
          name: CI Build
          files: FusionStrip-*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
